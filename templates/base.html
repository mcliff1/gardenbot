<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Gardenbot{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js" integrity="sha384-wGtTY4bBRFmJDvBQ4U2LGMF7oOY0pH0vivSriss1bdfOIxyTXFnMKInYA7PHkOh" crossorigin="anonymous"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">🌱 Gardenbot</a>
        </div>
        <ul class="nav-links">
            <li><a href="/" class="{% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a></li>
            <li><a href="/ui/yards" class="{% if active_page == 'yards' %}active{% endif %}">Yards</a></li>
            <li><a href="/ui/plants" class="{% if active_page == 'plants' %}active{% endif %}">Plants</a></li>
            <li><a href="/ui/ai" class="{% if active_page == 'ai' %}active{% endif %}">AI Assistant</a></li>
        </ul>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Gardenbot v0.1.0 &middot; AI-assisted landscaping</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
